# Cloudflare Pages configuration for Attend75 frontend

name = "attend75"
compatibility_date = "2024-01-01"

[build]
command = "cd frontend && npm install && npm run build"
cwd = "."
watch_dir = "frontend"

[build.upload]
format = "service-worker"
dir = "frontend/dist"
main = "./frontend/dist"

[[pages_build_output_dir]]
dir = "frontend/dist"
