<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b3a"/>
      <stop offset="100%" style="stop-color:#0d0b1e"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2650"/>
      <stop offset="100%" style="stop-color:#1a1835"/>
    </linearGradient>
    <linearGradient id="cardR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2650"/>
      <stop offset="100%" style="stop-color:#1a1835"/>
    </linearGradient>
    <linearGradient id="btnH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4EF0A0"/>
      <stop offset="100%" style="stop-color:#2BC87A"/>
    </linearGradient>
    <linearGradient id="btnL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B6B"/>
      <stop offset="100%" style="stop-color:#E04444"/>
    </linearGradient>
    <linearGradient id="vs" x1="135deg" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C47FF"/>
      <stop offset="100%" style="stop-color:#FF47C0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="225" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="112" x2="400" y2="112" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="225" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Left card -->
  <rect x="18" y="18" width="158" height="189" rx="14" fill="url(#cardL)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Left card image area -->
  <rect x="18" y="18" width="158" height="110" rx="14" fill="#16143080"/>
  <!-- Flag emoji stand-in -->
  <text x="97" y="84" text-anchor="middle" font-size="52">🌍</text>
  <!-- Left card name -->
  <text x="97" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white">India</text>
  <text x="97" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Population</text>
  <text x="97" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="900" fill="#FFD700">1.43B</text>

  <!-- VS circle -->
  <circle cx="200" cy="112" r="20" fill="url(#vs)" filter="drop-shadow(0 2px 6px rgba(108,71,255,0.5))"/>
  <text x="200" y="117" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="900" fill="white">VS</text>

  <!-- Right card -->
  <rect x="224" y="18" width="158" height="189" rx="14" fill="url(#cardR)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Right card image area -->
  <rect x="224" y="18" width="158" height="110" rx="14" fill="#16143080"/>
  <!-- Movie emoji stand-in -->
  <text x="303" y="84" text-anchor="middle" font-size="52">🎬</text>
  <!-- Right card name -->
  <text x="303" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="white">Avengers: Endgame</text>
  <text x="303" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="rgba(255,255,255,0.4)">Box Office</text>
  <!-- Mystery value -->
  <text x="303" y="182" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="900" fill="rgba(255,255,255,0.25)">?</text>

  <!-- Higher / Lower buttons at bottom -->
  <rect x="18" y="175" width="74" height="26" rx="8" fill="url(#btnH)"/>
  <text x="55" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="900" fill="black">▲ Higher</text>

  <rect x="96" y="175" width="74" height="26" rx="8" fill="url(#btnL)"/>
  <text x="133" y="193" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="900" fill="white">▼ Lower</text>
</svg>
